<div class="row g-4 justify-content-center">
  <div class="col-lg-10 mt-0">
    <div class="card card-custom card-composed account-card">
      <div class="card-composed-accent" aria-hidden="true"></div>
      <div class="card-composed-body p-4 p-lg-4">
        <div class="text-center mb-4 account-head">
          <h1 class="fw-bold mb-0 page-main-title">حساب المستعمل</h1>
        </div>

        <div class="account-split">
          <section class="account-panel">
            <div class="account-panel-title">المعلومات الشخصية</div>
            <div class="account-panel-body">
            <div class="account-info-grid">
              <div class="account-info-item">
                <div class="account-info-label">الاسم و اللقب</div>
                <div class="account-info-value">{{ auth.user()?.arName || '--' }}</div>
              </div>
              <div class="account-info-item">
                <div class="account-info-label">الرقم الآلي</div>
                <div class="account-info-value">{{ auth.user()?.matricule || '--' }}</div>
              </div>
              <div class="account-info-item">
                <div class="account-info-label">Nom et prénom</div>
                <div class="account-info-value">{{ frName() }}</div>
              </div>
            </div>
            </div>
          </section>

          <section class="account-panel">
            <div class="account-panel-title">تغيير كلمة المرور</div>
            <div class="account-panel-body" [class.with-gap]="!alert()">
            <div class="account-spacer" aria-hidden="true"></div>
            @if (alert()) {
              <div class="app-alert" [class.app-alert--success]="alertOk()">{{ alert() }}</div>
            }
            @if (!changed()) {
              @if (saving()) {
                <div class="change-password-loader">
                  <app-loader></app-loader>
                  <div class="small text-muted fw-semibold mt-3">تحديث...</div>
                </div>
              } @else {
                <form (ngSubmit)="submit()" novalidate>
                  <div class="mb-3">
                    <label class="form-label" for="old-pw">كلمة المرور القديمة</label>
                    <input
                      type="password" class="form-control pw-input" id="old-pw"
                      autocomplete="current-password" [(ngModel)]="oldPw" name="oldPw" required />
                  </div>
                  <div class="mb-3">
                    <label class="form-label" for="new-pw">كلمة المرور الجديدة</label>
                    <input
                      type="password" class="form-control pw-input" id="new-pw"
                      autocomplete="new-password" [(ngModel)]="newPw" name="newPw" required />
                  </div>
                  <div class="mb-3">
                    <label class="form-label" for="new-pw-2">تأكيد كلمة المرور الجديدة</label>
                    <input
                      type="password" class="form-control pw-input" id="new-pw-2"
                      autocomplete="new-password" [(ngModel)]="newPw2" name="newPw2" required />
                  </div>
                  <div class="d-flex justify-content-center mt-3 pw-submit">
                    <button type="submit" class="btn btn-primary btn-sm">تغيير كلمة المرور</button>
                  </div>
                </form>
              }
            }
            <div class="account-spacer" aria-hidden="true"></div>
            </div>
          </section>
        </div>
      </div>
    </div>
  </div>
</div>
