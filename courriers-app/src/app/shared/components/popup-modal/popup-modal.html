<div class="app-modal-backdrop" (click)="close()">
  <div
    class="app-modal-dialog"
    [class.app-modal-dialog--wide]="wide"
    [class.app-modal-dialog--medium]="medium"
    role="dialog"
    aria-modal="true"
    (click)="$event.stopPropagation()"
    dir="rtl"
  >
    <div class="app-modal-content">
      <div class="modal-header border-0 py-3 px-4">
        <h5 class="modal-title fw-bold">{{ title }}</h5>
        <button type="button" class="btn-close" (click)="close()" aria-label="إغلاق"></button>
      </div>
      <div class="modal-body pt-0 px-4 pb-4">
        <ng-content></ng-content>
      </div>
    </div>
  </div>
</div>
