<div class="app-modal-backdrop" (click)="onBackdropClick($event)">
  <div
    class="app-modal-dialog"
    [class.app-modal-dialog--wide]="wide"
    [class.app-modal-dialog--medium]="medium"
    role="dialog"
    aria-modal="true"
    dir="rtl"
  >
    <div class="app-modal-content">
      <div class="modal-header border-0 py-3 px-4">
        @if (title) {
          <h5 class="modal-title fw-bold">{{ title }}</h5>
        }
        <button type="button" class="btn-close" (click)="close()" (mousedown)="$event.preventDefault()" aria-label="إغلاق"></button>
      </div>
      <div class="modal-body px-4 pb-4" style="padding-top: 0.9rem;">
        <ng-content></ng-content>
      </div>
    </div>
  </div>
</div>
