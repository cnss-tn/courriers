<div class="dd" [class.dd-open]="open()" [class.dd-disabled]="disabled">
  <button
    type="button"
    class="dd-toggle"
    (click)="toggle()"
    [disabled]="disabled"
    [attr.aria-required]="required || null"
  >
    <span class="dd-chevron" aria-hidden="true"></span>
    <span class="dd-toggle-text" [class.dd-placeholder]="!value">{{ value || placeholder }}</span>
  </button>
  @if (open()) {
    <div class="dd-panel" [class.dd-panel--wide]="widePanel">
      @if (searchable && options.length) {
        <div class="dd-search" role="option">
          <input
            #searchBox
            type="text"
            placeholder="بحث..."
            [ngModel]="search()"
            (ngModelChange)="search.set($event)"
            (click)="$event.stopPropagation()"
            (keydown.enter)="chooseFirst(); $event.preventDefault()"
            (keydown.escape)="closeFromSearch()"
          />
        </div>
      }
      <div class="dd-list" role="listbox">
        @for (o of filtered(); track o) {
          <div
            class="dd-item"
            role="option"
            [class.dd-selected]="o === value"
            [class.dd-special]="!!specialLast && o === specialLast"
            (click)="choose(o)"
          ><span class="dd-text">{{ o }}</span>@if (meta[o]) {
            <span class="dd-code" dir="ltr">{{ meta[o] }}</span>
          }</div>
        }
      </div>
    </div>
  }
</div>
