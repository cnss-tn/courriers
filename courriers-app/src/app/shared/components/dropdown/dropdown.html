<div class="dd" [class.dd-open]="open()" [class.dd-disabled]="disabled">
  <button
    type="button"
    class="dd-toggle"
    (click)="toggle()"
    [disabled]="disabled"
    [attr.aria-required]="required || null"
  >
    <span class="dd-chevron" aria-hidden="true"></span>
    <span class="dd-toggle-text" [class.dd-placeholder]="!value">{{ value || placeholder }}</span>
  </button>
  @if (open()) {
    <div class="dd-panel">
      @if (searchable) {
        <div class="dd-search">
          <input type="text" placeholder="بحث..." [ngModel]="search()" (ngModelChange)="search.set($event)" />
        </div>
      }
      <div class="dd-list" role="listbox">
        <div class="dd-item dd-empty" role="option" [class.dd-selected]="!value" (click)="choose('')">{{ placeholder }}</div>
        @for (o of filtered(); track o) {
          <div
            class="dd-item"
            role="option"
            [class.dd-selected]="o === value"
            [class.dd-special]="!!specialLast && o === specialLast"
            (click)="choose(o)"
          >{{ o }}</div>
        }
        @if (searchable && !filtered().length) {
          <div class="dd-no-results">لا توجد نتائج</div>
        }
      </div>
    </div>
  }
</div>
